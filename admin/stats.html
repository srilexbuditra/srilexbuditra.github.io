<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visitor Statistics | Srilex Buditra</title>

   <link rel="stylesheet" href="stats.css">


</head>

<body>

<div class="container">

  <h1>Visitor Statistics</h1>
  <div class="subtitle">Srilex Buditra Website Analytics</div>

  <div class="login" id="loginBox">

    <label for="apiKey">Stats API Key</label>

    <input
      type="password"
      id="apiKey"
      placeholder="Masukkan STATS_API_KEY"
      autocomplete="off"
    >

    <button id="loadBtn">Buka Statistik</button>

    <div class="status" id="status"></div>

  </div>

  <div id="dashboard">

    <div class="cards">

      <div class="card">
        <div>Total Visitors</div>
        <div class="number" id="totalVisitors">0</div>
      </div>

      <div class="card">
        <div>Total Visits</div>
        <div class="number" id="totalVisits">0</div>
      </div>

      <div class="card">
  <div>Visitors Today</div>
  <div class="number" id="visitorsToday">0</div>
</div>

      <div class="stats-section">
  <h2>Device Statistics</h2>
  <div id="deviceStats"></div>
</div>
    </div>

  </div>

</div>

<script src="./stats.js"></script>

</body>
</html>
</body>
</html>
