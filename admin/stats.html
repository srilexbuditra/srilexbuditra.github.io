<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Statistics | Srilex Buditra</title>
  <link rel="stylesheet" href="stats.css">
</head>
<body>
  <main class="container">
    <h1>Visitor Statistics</h1>
    <div class="subtitle">Srilex Buditra Website Analytics</div>

    <section class="login" id="loginBox">
      <label for="apiKey">Stats API Key</label>
      <input
        type="password"
        id="apiKey"
        placeholder="Masukkan STATS_API_KEY"
        autocomplete="off"
      >
      <button id="loadBtn" type="button">Buka Statistik</button>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <section id="dashboard">
      <div class="cards">
        <article class="card">
          <div>Total Visitors</div>
          <div class="number" id="totalVisitors">0</div>
        </article>

        <article class="card">
          <div>Total Visits</div>
          <div class="number" id="totalVisits">0</div>
        </article>

        <article class="card">
          <div>Visitors Today</div>
          <div class="number" id="visitorsToday">0</div>
        </article>

        <section class="stats-section">
          <h2>Device Statistics</h2>
          <div class="stats-list" id="deviceStats"></div>
        </section>

        <section class="stats-section">
          <h2>Browser Statistics</h2>
          <div class="stats-list" id="browserStats"></div>
        </section>

        <section class="stats-section">
          <h2>Country Statistics</h2>
          <div class="stats-list" id="countryStats"></div>
        </section>

        <section class="stats-section wide-section">
          <h2>Top Pages</h2>
          <div class="stats-list" id="topPagesStats"></div>
        </section>

        <section class="stats-section wide-section">
          <h2>Traffic Sources</h2>
          <div class="stats-list" id="referrerStats"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="./stats.js"></script>
</body>
</html>
