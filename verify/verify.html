    <main class="verify-shell">

          <div class="item"><span>Fingerprint</span><strong id="v-fingerprint">-</strong></div>
        </div>
        <div id="invalidNote" class="note" hidden></div>
        <div id="verifyQrBox" class="qr-box"><a id="qrLink" href="./"><img id="verifyQr" alt="QR verifikasi dokumen"></a></div>
        <div class="actions"><a href="../">Kembali ke Website</a></div>
