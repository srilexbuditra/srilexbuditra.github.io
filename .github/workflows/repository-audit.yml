name: Public Repository Audit

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  public-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Block common sensitive filenames
        shell: bash
        run: |
          set -e
          PATTERN='(^|/)(\.env|\.env\.local|\.env\.production|id_rsa|credentials\.json|service-account\.json)$'
          if git ls-files | grep -E "$PATTERN"; then
            echo "A commonly sensitive file is tracked. Remove it from the public repository."
            exit 1
          fi

      - name: Check for private key markers
        shell: bash
        run: |
          set -e
          if git grep -nE -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!*.pdf' ':!*.png' ':!*.jpg' ':!*.jpeg'; then
            echo "Private key marker found."
            exit 1
          fi

      - name: Flag common sensitive document names for review
        shell: bash
        run: |
          set -e
          matches=$(git ls-files | grep -Ei '(paspor|password|credential)' || true)
          if [ -n "$matches" ]; then
            echo "Review these potentially sensitive filenames:"
            echo "$matches"
            exit 1
          fi
          echo "No common sensitive filenames detected."

      - name: Confirm public audit policy exists
        shell: bash
        run: test -f PUBLIC_REPOSITORY_AUDIT.md
