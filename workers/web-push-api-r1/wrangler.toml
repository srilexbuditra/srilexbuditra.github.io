name = "srilexbuditra-web-push-api-r1"
main = "src/index.js"
compatibility_date = "2026-10-08"
workers_dev = false

[vars]
VAPID_SUBJECT = "https://srilexbuditra.work/"

[[d1_databases]]
binding = "DB"
database_name = "srilexbuditra-web-push-r1"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Configure outside Git before deployment:
# VAPID_PUBLIC_KEY
# VAPID_PRIVATE_KEY
# PUSH_ADMIN_TOKEN